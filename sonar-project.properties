# ============================================================
# SonarCloud — Project Configuration
# ============================================================

sonar.projectKey=ouriva_ouriva
sonar.organization=ouriva

# ── Sources ─────────────────────────────────────────────────
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Point Sonar at the TypeScript config so it can resolve path
# aliases (@/*) and understand the module graph. Without this,
# every @/ import is flagged as an unresolved module.
sonar.typescript.tsconfigPath=tsconfig.json

# Tell Sonar which global environments are valid.
# "browser" covers React/DOM code; "node" covers API routes,
# server actions, and any server-only library imports.
sonar.javascript.environments=browser,node

# ── Exclusions ──────────────────────────────────────────────
# Files excluded from analysis entirely:
#   src/components/ui/  — shadcn/ui components, auto-generated
#                         by the shadcn CLI and not hand-authored
#   src/generated/      — any code-gen output (Prisma, etc.)
#   src/app/sw.ts       — service worker, framework boilerplate
#   .next/              — build output
#   prisma/migrations/  — auto-generated SQL migration files
sonar.exclusions=\
  src/components/ui/**,\
  src/generated/**,\
  src/app/sw.ts,\
  **/.next/**,\
  **/prisma/migrations/**

# ── Coverage ────────────────────────────────────────────────
# No tests exist yet. Without this exclusion, Sonar reports
# 0% coverage as a blocking Quality Gate failure even though
# the project intentionally has no test suite at this stage.
sonar.coverage.exclusions=**/*

# ── Duplication ─────────────────────────────────────────────
# Exclude generated and UI library files from copy-paste
# detection — they follow repetitive patterns by design and
# would inflate duplication metrics artificially.
sonar.cpd.exclusions=\
  src/components/ui/**,\
  src/generated/**

# ── Quality Gate ────────────────────────────────────────────
# Wait for the Quality Gate result before the CI step exits.
# Without this, the scan action submits the analysis and
# immediately returns exit 0 — issues found on the platform
# never fail the build.
sonar.qualitygate.wait=true
