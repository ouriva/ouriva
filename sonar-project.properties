sonar.projectKey=ouriva_ouriva
sonar.organization=ouriva

# Only scan application source — skip generated files, migrations, and build output
sonar.sources=src
sonar.exclusions=**/.next/**,**/prisma/migrations/**

sonar.sourceEncoding=UTF-8

# Wait for the Quality Gate result before the CI step exits.
# Without this, the scan action submits the analysis and immediately
# returns exit 0 — the gate result is computed asynchronously and
# never checked, so CI always passes regardless of issues found.
sonar.qualitygate.wait=true
