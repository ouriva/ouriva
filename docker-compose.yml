# ============================================================
# Budget Tracker — Docker Compose (Production)
# ============================================================
# Runs the pre-built app image on the Raspberry Pi.
# The image is built on your Mac and transferred via deploy.sh.
#
# Setup (one-time on the Pi):
#   1. mkdir ~/budget-tracker && cd ~/budget-tracker
#   2. Copy this file: scp docker-compose.yml pi:~/budget-tracker/
#   3. Create .env with your real DATABASE_URL:
#      echo 'DATABASE_URL=postgresql://budget_app:YOUR_PASS@DB_HOST:5432/personal_finance' > .env
#
# Usage:
#   Start:    docker compose up -d
#   Logs:     docker compose logs -f
#   Stop:     docker compose down
# ============================================================

services:
  app:
    image: budget-tracker:latest
    ports:
      - "3000:3000"
    environment:
      # Read DATABASE_URL from the .env file on the Pi.
      # Docker Compose automatically loads .env from the same
      # directory as docker-compose.yml. The ${VAR} syntax
      # substitutes the value from that file.
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
