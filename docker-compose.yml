# ============================================================
# Ouriva — Docker Compose (All-in-One)
# ============================================================
# Runs the app and a PostgreSQL database together on a single
# server. The default, recommended way to self-host — if you
# already run your own Postgres elsewhere, use
# docker-compose.external-db.yml instead.
#
# Quick start:
#   1. Change the passwords below (search for CHANGE_ME)
#   2. Run:
#        docker compose up -d
#   3. Run migrations on first start:
#        docker compose run --rm migrate
#   4. Open http://localhost:3000
#
# For HTTPS, put a reverse proxy (Caddy recommended) in front:
#   https://caddyserver.com/docs/quick-starts/reverse-proxy
# ============================================================

services:
  app:
    build: .
    image: ouriva:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ouriva:CHANGE_ME_APP_PASSWORD@db:5432/ouriva
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ouriva
      POSTGRES_USER: ouriva
      POSTGRES_PASSWORD: CHANGE_ME_APP_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouriva -d ouriva"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off migration runner — not started by `docker compose up`
  # (the "tools" profile only activates for an explicit `run`).
  # The published app image's final stage deliberately removes
  # npm/npx to shrink its attack surface, so it can't run Prisma
  # itself; this builds the "builder" stage instead, one step
  # earlier in the same multi-stage build, which still has the
  # full toolchain. Only needed on first start and after upgrades
  # that add new migrations.
  migrate:
    build:
      context: .
      target: builder
    image: ouriva:migrator
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql://ouriva:CHANGE_ME_APP_PASSWORD@db:5432/ouriva
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  db_data:
