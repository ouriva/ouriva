# ============================================================
# Ouriva — Docker Compose (Production)
# ============================================================
# Runs the pre-built app image against an external database.
#
# Setup (one-time on your server):
#   1. mkdir ~/ouriva && cd ~/ouriva
#   2. Copy this file to the server
#   3. Create .env with your DATABASE_URL:
#      echo 'DATABASE_URL=postgresql://user:pass@db-host:5432/ouriva' > .env
#
# Usage:
#   Start:    docker compose up -d
#   Logs:     docker compose logs -f
#   Stop:     docker compose down
# ============================================================

services:
  app:
    image: ouriva:latest
    ports:
      - "3000:3000"
    environment:
      # DATABASE_URL is read from the .env file in the same directory.
      # Docker Compose loads .env automatically; ${VAR} substitutes it.
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
