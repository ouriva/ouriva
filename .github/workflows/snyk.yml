name: Snyk Container

# Snyk scans the Docker image for OS-level and base image vulnerabilities —
# CVEs in the Linux packages bundled into the image that neither Dependabot
# (npm dependencies) nor CodeQL (source code) can see.
#
# Only high and critical severity issues fail the workflow to avoid noise
# from low-risk findings. Results are uploaded to the GitHub Security tab
# as code scanning alerts alongside CodeQL findings.
#
# Runs on:
#   - Every push to main
#   - Every pull request targeting main
#   - Weekly on Fridays at 01:00 UTC (same cadence as CodeQL)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 5"

jobs:
  snyk-container:
    name: Snyk Container Scan
    runs-on: ubuntu-latest
    # Dependabot PRs only bump dependency versions — skip Snyk to avoid
    # burning free-plan test quota on automated dependency updates.
    if: github.actor != 'dependabot[bot]'

    permissions:
      # Required to upload Snyk results to the GitHub Security tab
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Build the image locally so Snyk scans exactly what would be deployed,
      # not a cached or registry version.
      - name: Build Docker image
        run: docker build -t ouriva:${{ github.sha }} .

      - name: Snyk Container scan
        id: snyk
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ouriva:${{ github.sha }}
          # Only fail on high/critical — low and medium are informational
          args: --severity-threshold=high --file=Dockerfile
        # continue-on-error allows the SARIF upload step to always run so
        # findings reach the Security tab even when the threshold is exceeded.
        # A separate step below re-raises the failure after uploading.
        continue-on-error: true

      # Upload findings to the GitHub Security tab so they appear as code
      # scanning alerts alongside CodeQL results in one unified view.
      # Skipped when snyk.sarif is absent (e.g. Docker build failed before
      # Snyk ran and had a chance to write the file).
      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

      # Re-raise the Snyk failure AFTER uploading results so the PR is
      # blocked when high/critical vulnerabilities are found.
      - name: Fail if Snyk found high/critical vulnerabilities
        if: steps.snyk.outcome == 'failure'
        run: exit 1
