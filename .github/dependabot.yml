version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    groups:
      # Group all non-breaking patch and minor updates into a single PR
      # to reduce noise. Major version bumps come through individually
      # so they can be reviewed carefully.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors the toolchain can't take yet: ESLint 10 crashes eslint-plugin-react
      # (react/display-name), typescript-eslint doesn't support TypeScript 7.
      # Remove each rule once eslint-config-next / typescript-eslint support it.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=7"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"

  # Docker base image
  # Tracks the node:22-alpine digest in the Dockerfile and opens a PR
  # whenever a new image is published — keeping the pinned digest current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
